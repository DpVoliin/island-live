# ---- JVM：构建机可用内存约 3.2G（实测 free -m），按这个量给参数 ----
# ⚠️ 踩过的坑：原来 MetaspaceSize=320m + in-process 编译，工程涨到 77 个文件时
#    抛 OutOfMemoryError: Metaspace（不是堆！），栈顶是 GradleKotlinCompilerWork$compileInProcess。
#    in-process 意味着 Kotlin 编译器和 Gradle 共用这一个 JVM 的元数据区 —— 而元数据区装的是
#    所有类的元信息，随文件数线性增长，320m 很快就不够。现在给到 640m。
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=640m -XX:ReservedCodeCacheSize=128m -XX:MaxDirectMemorySize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configureondemand=false
# in-process 省一个 JVM（这台机内存紧），前提是上面的 Metaspace 给够
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# ---- Android ----
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
